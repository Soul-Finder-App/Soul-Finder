<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Soul Finder – Discover the Universe Within You</title>
    <meta name="description" content="A reflective journey through your life path number, soul age, spiritual role and purpose.">
    
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./favicon.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    
    <!-- PWA Manifest & Theme Configuration -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#121a36">
    
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root{--bg:#0E1A3A;--ink:#EAF3FF;--mute:#A9C0EA;--card:#16264F;--line:#2B427A;--accent:#8FB4FF;--btn-ink:#0E1A3A;--glow:#3b3a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        :root[data-theme="dark"]{--bg:#0E1A3A;--ink:#EAF3FF;--mute:#A9C0EA;--card:#16264F;--line:#2B427A;--accent:#8FB4FF;--btn-ink:#0E1A3A;--glow:#3b3a6b}
        html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
        body{margin:0;background:radial-gradient(circle at 85% 0,var(--glow),transparent 40%),var(--bg);color:var(--ink);font:17px/1.65 Figtree,system-ui,sans-serif}
        h1,h2,h3,.q{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;margin:0 0 .5em}
        h1{font-size:clamp(2.2rem,6vw,3.4rem)}h2{font-size:1.7rem;margin-top:1.5em}.q{font-size:1.7rem;margin:14px 0 18px}
        .wrap{max-width:1040px;margin:0 auto;padding:22px 20px 60px}.brand{font:700 1.5rem Fraunces,serif}.mute{color:var(--mute)}
        :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
        .btn{background:var(--accent);color:var(--btn-ink);border:0;border-radius:999px;padding:13px 28px;font:600 1rem Figtree,sans-serif;cursor:pointer}
        .btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn[disabled]{opacity:.5;cursor:not-allowed}
        .opts{display:grid;gap:10px}.opts button{text-align:left;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
        .opts button:hover{border-color:var(--accent)}.opts button[aria-pressed=true]{border-color:var(--accent);background:var(--glow)}
        .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
        .sec{font-weight:600;color:var(--accent);margin:12px 0 0}
        .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 22px;margin:14px 0}
        .track{position:relative;height:6px;background:var(--line);border-radius:3px;margin:34px 8px 44px}
        .track b{position:absolute;top:-24px;font-size:.78rem;font-weight:500;transform:translateX(-50%);white-space:nowrap}
        .track i{position:absolute;top:-6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px var(--glow)}
        .role{display:flex;gap:14px;align-items:flex-start;margin:10px 0}.role span{font-size:1.8rem;line-height:1}
        header.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}header.top a{color:var(--accent)}
        label{display:block;margin:12px 0}input[type=email],input[type=password]{display:block;width:100%;padding:12px 14px;margin-top:4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
        .opt{display:flex;gap:10px;align-items:center}.err{color:#FFB4B4}a{color:var(--accent)}
        .narrow{max-width:700px;margin:0 auto}a.btn{display:inline-block;text-decoration:none}
        .home .hero{background:radial-gradient(circle at 78% 18%,var(--glow),transparent 38%),linear-gradient(180deg,#17306B,var(--bg));border-radius:28px;padding:34px 24px 40px;margin-top:10px}
        .home .cols{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}
        .home h1{font-size:clamp(2.6rem,7vw,4.4rem)}.home .lead{font-size:1.2rem;max-width:34ch;color:var(--mute)}
        svg.wheel{width:100%;max-width:440px;margin:auto;display:block;overflow:visible}
        .n{cursor:pointer}.n circle{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:fill .2s}.n use{stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
        .n:hover circle,.n:focus circle,.n.on circle{fill:var(--glow);stroke:var(--accent)}.ring{fill:none;stroke:var(--accent);stroke-width:1;opacity:.5}
        @media (prefers-reduced-motion:no-preference){.orbit{animation:spin 120s linear infinite;transform-box:fill-box;transform-origin:center}}
        @keyframes spin{to{transform:rotate(360deg)}}
        #rd{text-align:center;min-height:3.4em;max-width:36ch;margin:6px auto 0;color:var(--mute)}
        .home section{padding:44px 0}.home h2{font-size:clamp(1.9rem,4vw,2.6rem)}
        .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.grid .card{margin:0}
        .card svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
        .card h3{font-size:1.25rem;margin:.6em 0 .3em}.card p{margin:0;color:var(--mute);font-size:.98rem}
        /*v2*/:root{--gold:#8FB4FF}
        header.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:nowrap;gap:10px;padding:6px 0 4px}
        #nav{display:flex;gap:10px;align-items:center}
        .pill{display:inline-block;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);text-decoration:none;font:600 .95rem Figtree,system-ui,sans-serif;cursor:pointer}
        .pill:hover{border-color:var(--accent)}.pill.fill{background:var(--accent);color:var(--btn-ink);border-color:var(--accent)}.pill[disabled]{opacity:.5}
        .btn.full{width:100%;margin-top:6px}.small{font-size:.9rem}
        .auth{max-width:460px;margin:26px auto;text-align:center}.auth .icon{width:68px;height:68px;border-radius:50%;background:var(--glow);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 16px}
        .auth .icon svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
        .auth form{text-align:left;padding:24px 24px 20px;margin:18px 0}.auth h1{font-size:clamp(1.9rem,5vw,2.5rem)}
        input[type=text],input[type=date]{display:block;width:100%;padding:12px 14px;margin-top:4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;color-scheme:dark}
        input:focus{outline:3px solid var(--accent);outline-offset:1px}
        .lp{display:flex;gap:20px;align-items:center}.bignum{font:700 5.5rem/1 Fraunces,Georgia,serif;color:var(--accent);min-width:86px;text-align:center}
        .tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:20px}.tile{margin:0}
        .chip{display:inline-block;padding:3px 12px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--mute)}.chip.ok{border-color:var(--accent);color:var(--accent)}
        .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
        .legal h3{font-size:1.2rem;margin-top:1.4em}.foot{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;border-top:1px solid var(--line);margin-top:48px;padding-top:22px;font-size:.92rem;color:var(--mute)}.foot a{color:var(--mute)}
        @media (max-width:520px){.lp{flex-direction:column;text-align:center}}
        @media print{body{background:#fff!important;color:#111!important}.noprint,header.top,.foot{display:none!important}.pg{border:0!important;background:#fff!important;color:#111!important;break-after:page}.pg *{color:#111!important}.cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}.cover *{color:#fff!important}}
        /*rpt*/.pg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 30px;margin:20px 0}.cover{background:radial-gradient(1.5px 1.5px at 15% 25%,#F7F1E9,transparent),radial-gradient(1px 1px at 80% 18%,#C9A36B,transparent),radial-gradient(1.5px 1.5px at 62% 78%,#B7A8D7,transparent),linear-gradient(160deg,#1E3F9E 30%,#3D6FE0);color:#F7F1E9;text-align:center;padding:64px 24px}.cover p{margin:.3em auto;color:#d8d0ea}.cover .big{font:600 7rem/1 "Fraunces",serif;color:#C9A36B;margin:0}.wk{border-left:3px solid var(--gold);padding-left:14px;margin:14px 0}.tag{color:var(--gold);font-weight:600}/*m1*/@media (max-width:560px){header.top .brand{font-size:1.3rem}#nav{gap:8px}.pill{padding:7px 14px;font-size:.88rem}.hide-sm{display:none}}
    </style>
</head>

    <div class="wrap">
        <header class="top">
            <a class="brand" href="#/" style="text-decoration:none;color:var(--ink)">Soul Finder</a>

            <a href="#/terms">Terms</a>

</body>
